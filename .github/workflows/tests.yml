name: Tests

# readme.txt/docs-only pushes (e.g. the nightly "Tested up to:" bump) can't affect
# integration results, so they're excluded. This is a private repo: every run is
# billable, and starving the budget here blocks assets.yml from reaching wp.org.
# Releases are unaffected: deploy.yml invokes this via workflow_call, which is
# never subject to path filters.
on:
  push:
    branches: [trunk]
    paths-ignore:
      - 'readme.txt'
      - '**.md'
      - '.wordpress-org/**'
  pull_request:
    branches: [trunk]
    paths-ignore:
      - 'readme.txt'
      - '**.md'
      - '.wordpress-org/**'
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  e2e:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: opcache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure pip cache dir exists
        run: mkdir -p ~/.cache/pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tester image (cached)
        uses: docker/build-push-action@v5
        with:
          context: tests
          file: tests/Dockerfile
          tags: opcache/tester:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build WordPress image (cached)
        uses: docker/build-push-action@v5
        with:
          context: tests
          file: tests/Dockerfile.wordpress
          tags: opcache/wordpress:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start DB and WordPress
        working-directory: tests
        run: docker compose -p opcache up -d db wordpress

      - name: Wait for WordPress health
        working-directory: tests
        run: |
          # Wait until wordpress reports healthy
          for i in {1..120}; do
            WP=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose -p opcache ps -q wordpress) || true)
            echo "WordPress status: $WP"
            if [ "$WP" = "healthy" ]; then
              echo "WordPress is healthy!"
              break
            fi
            sleep 2
          done

      - name: WP Setup
        working-directory: tests
        run: bash setup.sh

      - name: Run tests (compose up with exit code)
        working-directory: tests
        run: docker compose -p opcache up --exit-code-from tester --abort-on-container-exit tester

      - name: Show logs on failure
        if: failure()
        working-directory: tests
        run: |
          echo "== Docker ps =="
          docker ps -a || true
          echo "== Compose ps =="
          docker compose -p opcache ps || true
          echo "== Compose logs (last 500 lines) =="
          docker compose -p opcache logs --no-color | tail -n 500 || true

      - name: Teardown
        if: always()
        working-directory: tests
        run: docker compose -p opcache down -v
