name: opcache-reset

networks:
  opcache_net:
    name: opcache_net

services:
  db:
    image: mariadb:10.11
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - opcache_net

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wordpress
    depends_on:
      db:
        condition: service_healthy
      php-fpm:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/opcache-reset
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
      - ./fixtures:/workspace/tests/fixtures
      - fpm_socket:/run/php
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${TEST_PORT:-8080}:80"
    networks:
      - opcache_net

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - db
      - wordpress
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/opcache-reset
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
      - ./wp-cli.yml:/var/www/html/wp-cli.yml:ro
    entrypoint: wp
    command: --info
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
    networks:
      - opcache_net

  tester:
    image: opcache-reset/tester:ci
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    working_dir: /workspace
    volumes:
      - wp_data:/var/www/html
      - ../:/workspace
    entrypoint: pytest
    command: -q -c tests/pytest.ini
    environment:
      WP_URL: http://wordpress
      WP_BACKEND_URL: http://wordpress
    networks:
      - opcache_net

  # PHP-FPM service for testing direct FastCGI communication
  php-fpm:
    image: php:8.2-fpm
    volumes:
      - ../:/var/www/html/wp-content/plugins/opcache-reset
      - fpm_socket:/run/php
    command: >
      sh -c "
        docker-php-ext-enable opcache &&
        echo 'opcache.enable=1' >> /usr/local/etc/php/conf.d/opcache.ini &&
        echo 'opcache.enable_cli=1' >> /usr/local/etc/php/conf.d/opcache.ini &&
        sed -i 's|listen = 9000|listen = /run/php/php-fpm.sock|' /usr/local/etc/php-fpm.d/zz-docker.conf &&
        sed -i '/listen.owner/d' /usr/local/etc/php-fpm.d/zz-docker.conf &&
        sed -i '/listen.group/d' /usr/local/etc/php-fpm.d/zz-docker.conf &&
        sed -i '/listen.mode/d' /usr/local/etc/php-fpm.d/zz-docker.conf &&
        echo 'listen.owner = www-data' >> /usr/local/etc/php-fpm.d/zz-docker.conf &&
        echo 'listen.group = www-data' >> /usr/local/etc/php-fpm.d/zz-docker.conf &&
        echo 'listen.mode = 0666' >> /usr/local/etc/php-fpm.d/zz-docker.conf &&
        php-fpm
      "
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/php/php-fpm.sock"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - opcache_net

volumes:
  wp_data:
  fpm_socket:

