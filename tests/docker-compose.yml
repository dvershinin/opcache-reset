name: opcache-reset

networks:
  opcache_net:
    name: opcache_net

services:
  db:
    image: mariadb:10.11
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - opcache_net

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wordpress
    depends_on:
      db:
        condition: service_healthy
      php-fpm:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/opcache-reset
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
      - ./fixtures:/workspace/tests/fixtures
      - fpm_socket:/run/php
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "${TEST_PORT:-8080}:80"
    networks:
      - opcache_net

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - db
      - wordpress
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/opcache-reset
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
      - ./wp-cli.yml:/var/www/html/wp-cli.yml:ro
    entrypoint: wp
    command: --info
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
    networks:
      - opcache_net

  tester:
    image: opcache-reset/tester:ci
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    working_dir: /workspace
    volumes:
      - wp_data:/var/www/html
      - ../:/workspace
    entrypoint: pytest
    command: -q -c tests/pytest.ini
    environment:
      WP_URL: http://wordpress
      WP_BACKEND_URL: http://wordpress
    networks:
      - opcache_net

  # PHP-FPM service for testing direct FastCGI communication
  php-fpm:
    image: php:8.2-fpm
    volumes:
      - ../:/var/www/html/wp-content/plugins/opcache-reset
      - fpm_socket:/run/php
    # Rewrite the pool to listen on a unix socket so the plugin's direct-FastCGI
    # path has something to talk to.
    #
    # Do NOT go back to `sed 's|listen = 9000|...|'`: the php:8.2-fpm image was
    # rebuilt 2026-08-05 with that line REMOVED from zz-docker.conf (its [www]
    # section is now empty and annotated "will be removed in 8.6+"). The sed
    # silently matched nothing, FPM fell back to www.conf's 127.0.0.1:9000, the
    # socket was never created, and the healthcheck failed forever.
    #
    # Deleting every `listen*` line and appending our own is robust to both the
    # old and new upstream layouts. zz-docker.conf sorts last, so these win.
    #
    # Use one `echo` per directive, NOT `printf '%s\n' a b c d`. In a folded YAML
    # scalar the `\n` becomes a real newline, and Compose versions disagree on
    # whether that newline then folds to a space: locally it survives, on the CI
    # runner it folded, so the format string degraded to '%s ' and all four
    # directives were appended as ONE space-separated line. FPM rejected it with
    # "syntax error, unexpected '='" and exited 78. Separate echoes joined by &&
    # are immune to the folding difference.
    command: >
      sh -c "
        docker-php-ext-enable opcache &&
        echo 'opcache.enable=1' >> /usr/local/etc/php/conf.d/opcache.ini &&
        echo 'opcache.enable_cli=1' >> /usr/local/etc/php/conf.d/opcache.ini &&
        sed -i '/^[[:space:]]*listen/d' /usr/local/etc/php-fpm.d/zz-docker.conf &&
        echo 'listen = /run/php/php-fpm.sock' >> /usr/local/etc/php-fpm.d/zz-docker.conf &&
        echo 'listen.owner = www-data' >> /usr/local/etc/php-fpm.d/zz-docker.conf &&
        echo 'listen.group = www-data' >> /usr/local/etc/php-fpm.d/zz-docker.conf &&
        echo 'listen.mode = 0666' >> /usr/local/etc/php-fpm.d/zz-docker.conf &&
        php-fpm
      "
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/php/php-fpm.sock"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - opcache_net

volumes:
  wp_data:
  fpm_socket:

