<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <!-- Background gradient - deep purple to indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B"/>
      <stop offset="50%" style="stop-color:#312E81"/>
      <stop offset="100%" style="stop-color:#3730A3"/>
    </linearGradient>
    
    <!-- Accent gradient for icon background -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#5B21B6"/>
    </linearGradient>
    
    <!-- Lightning gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    
    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E7FF"/>
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#C7D2FE"/>
    </linearGradient>
    
    <!-- Glow filter for lightning -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#6366F1" opacity="0.15"/>
    </pattern>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0C0A24" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="1544" height="500" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern overlay -->
  <rect width="1544" height="500" fill="url(#grid)"/>
  
  <!-- Decorative circles in background -->
  <circle cx="1400" cy="80" r="200" fill="#4F46E5" opacity="0.1"/>
  <circle cx="150" cy="420" r="150" fill="#7C3AED" opacity="0.1"/>
  <circle cx="1200" cy="400" r="100" fill="#8B5CF6" opacity="0.08"/>
  
  <!-- Speed lines on the right side -->
  <g opacity="0.2">
    <line x1="1200" y1="150" x2="1500" y2="150" stroke="#A5B4FC" stroke-width="2"/>
    <line x1="1250" y1="190" x2="1520" y2="190" stroke="#A5B4FC" stroke-width="2"/>
    <line x1="1280" y1="230" x2="1540" y2="230" stroke="#A5B4FC" stroke-width="2"/>
    <line x1="1200" y1="310" x2="1500" y2="310" stroke="#A5B4FC" stroke-width="2"/>
    <line x1="1250" y1="350" x2="1520" y2="350" stroke="#A5B4FC" stroke-width="2"/>
  </g>
  
  <!-- Icon area with glow -->
  <g transform="translate(200, 250)" filter="url(#shadow)">
    <!-- Icon background circle -->
    <circle cx="0" cy="0" r="100" fill="url(#iconBg)"/>
    
    <!-- Circular refresh arrows -->
    <g>
      <!-- Top-right arrow arc -->
      <path d="M 0 -58 A 58 58 0 0 1 50 29" 
            fill="none" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round"
            opacity="0.9"/>
      <!-- Arrow head -->
      <polygon points="50,29 62,16 45,12" fill="url(#arrowGrad)" opacity="0.9"/>
      
      <!-- Bottom-left arrow arc -->
      <path d="M 0 58 A 58 58 0 0 1 -50 -29" 
            fill="none" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round"
            opacity="0.9"/>
      <!-- Arrow head -->
      <polygon points="-50,-29 -62,-16 -45,-12" fill="url(#arrowGrad)" opacity="0.9"/>
    </g>
    
    <!-- Lightning bolt -->
    <g filter="url(#glow)">
      <path d="M 12 -55 
               L -18 -4 
               L 0 -4 
               L -12 55 
               L 26 -10 
               L 6 -10 
               L 12 -55 Z" 
            fill="url(#boltGrad)"/>
    </g>
  </g>
  
  <!-- Plugin name -->
  <text x="360" y="225" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="72" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">
    OPcache Reset
  </text>
  
  <!-- Tagline -->
  <text x="362" y="295" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="26" font-weight="400" fill="#A5B4FC" letter-spacing="0.5">
    Automatic OPcache management for WordPress
  </text>
  
  <!-- Feature pills -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">
    <!-- Pill 1: Memory Cache -->
    <g transform="translate(360, 340)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#4F46E5" opacity="0.4"/>
      <text x="60" y="21" text-anchor="middle" fill="#E0E7FF">Memory Cache</text>
    </g>
    
    <!-- Pill 2: File Cache -->
    <g transform="translate(495, 340)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#4F46E5" opacity="0.4"/>
      <text x="50" y="21" text-anchor="middle" fill="#E0E7FF">File Cache</text>
    </g>
    
    <!-- Pill 3: Auto Updates -->
    <g transform="translate(610, 340)">
      <rect x="0" y="0" width="115" height="32" rx="16" fill="#4F46E5" opacity="0.4"/>
      <text x="57" y="21" text-anchor="middle" fill="#E0E7FF">Auto Updates</text>
    </g>
    
    <!-- Pill 4: CLI Support -->
    <g transform="translate(740, 340)">
      <rect x="0" y="0" width="105" height="32" rx="16" fill="#4F46E5" opacity="0.4"/>
      <text x="52" y="21" text-anchor="middle" fill="#E0E7FF">CLI Support</text>
    </g>
  </g>
  
  <!-- PHP elephant silhouette (subtle) -->
  <g transform="translate(1300, 250)" opacity="0.08">
    <ellipse cx="0" cy="0" rx="80" ry="60" fill="#A5B4FC"/>
    <ellipse cx="-60" cy="-30" rx="25" ry="35" fill="#A5B4FC"/>
    <ellipse cx="40" cy="40" rx="15" ry="25" fill="#A5B4FC"/>
  </g>
</svg>

